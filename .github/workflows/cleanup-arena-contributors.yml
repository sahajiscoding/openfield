name: one-time contributor history cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[cleanup-arena-contributors]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Remove Arena co-author trailers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sahajiscoding"
          git config user.email "135018977+sahajiscoding@users.noreply.github.com"

          FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch --force             --msg-filter 'sed -E "/^Co-authored-by: (arena-agent|arena-ai-coding-agent\[bot\]) /d"'             --tag-name-filter cat             -- --all

          git reflog expire --expire=now --all
          git gc --prune=now --aggressive

          git push origin --force --all
          git push origin --force --tags
